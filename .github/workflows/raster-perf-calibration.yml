name: Raster perf calibration

# The calibration MECHANISM for benchmarks/perf-baselines/raster-baselines.json, not a
# per-commit gate: a full, multi-run statistical BenchmarkDotNet run of RasterizeBenchmarks on the
# linux CI runner platform (ci.yml's raster-perf-gate job keeps its `--job short` fast run as the
# per-commit regression gate). Trigger it from the Actions tab (or
# `gh workflow run raster-perf-calibration.yml`) after any deliberate performance change, then
# set each benchmark's baselineMs to the printed mean and size its toleranceFraction so the limit
# clears the slowest recent per-commit raster-perf-gate reading (see the file's calibrationNote).
# Raising a baselineMs or toleranceFraction needs a "PERF-LOOSEN:" token in a commit message
# (scripts/check-raster-perf-baseline.sh); lowering one never does.
on:
  workflow_dispatch: {}

# Least privilege: every job only reads the repository. No job needs a write
# token, and untrusted fork PRs must not receive one.
permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build benchmarks solution
        run: dotnet build benchmarks/bench.sln -c Release
      # Deliberately NOT --job short (that flag is raster-perf-gate's own fast per-commit gate):
      # this is the full, default BenchmarkDotNet job — multiple pilot/warmup/actual iterations,
      # its own statistical outlier handling — the "PROPER multi-run" calibration this workflow asks for.
      # `--buildTimeout 900` (seconds) is load-bearing here exactly as in ci.yml's raster-perf-gate:
      # BenchmarkDotNet builds its auto-generated boilerplate project out-of-process, and on the
      # 2-core hosted runner that build overran the 120 s default, leaving every benchmark inert (NA).
      - name: Run RasterizeBenchmarks (full statistical job) and export JSON
        run: dotnet run -c Release --no-build --project benchmarks/PlumePdf.Benchmarks -- --filter '*RasterizeBenchmarks*' --exporters json --buildTimeout 900
      - name: Print measured means (copy into raster-baselines.json by hand)
        run: |
          echo "Measured means for this linux-CI run:"
          jq -r '.Benchmarks[] | "\(.FullName): \(.Statistics.Mean) ns  (\(.Statistics.Mean / 1000000) ms)"' \
            BenchmarkDotNet.Artifacts/results/PlumePdf.Benchmarks.RasterizeBenchmarks-report-full.json
      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raster-benchmark-calibration
          path: BenchmarkDotNet.Artifacts/results/
          retention-days: 30
