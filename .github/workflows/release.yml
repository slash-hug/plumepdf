name: Release

# Publishes PlumePdf when a change to <Version> in src/PlumePdf/PlumePdf.csproj reaches main:
# merging the version-bump PR is the release approval. The workflow then builds, tests and packs,
# pushes the package to nuget.org, and creates the v<Version> tag and a GitHub Release whose notes
# are that version's CHANGELOG.md section. Nothing is published when the version did not change
# or its tag already exists. Re-run it by hand (workflow_dispatch) after a partial failure: the
# NuGet push skips a version that is already there, and the tag check keeps it idempotent.
#
# NuGet Trusted Publishing: GitHub issues a short-lived OIDC token, nuget.org exchanges it for a
# one-hour API key — no long-lived key is stored in this repository.
#
# One-time owner setup:
#   nuget.org → your profile → Trusted Publishing → policy: Repository Owner slash-hug,
#     Repository plumepdf, Workflow File release.yml, Environment nuget-release
#   repository secret NUGET_USER = the nuget.org profile name (not an email address)
#   environment nuget-release: deployment branch main (no reviewer; the merge is the approval)
#   tag ruleset for v*: GitHub Actions in its bypass list, so this workflow can create the tag

on:
  push:
    branches: [main]
    paths: ['src/PlumePdf/PlumePdf.csproj']
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this push releases
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          read_version() { sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -n 1; }
          version="$(read_version < src/PlumePdf/PlumePdf.csproj)"
          if [ -z "$version" ]; then
            echo "::error::No <Version> in src/PlumePdf/PlumePdf.csproj"
            exit 1
          fi

          previous=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            previous="$(git show "$BEFORE:src/PlumePdf/PlumePdf.csproj" 2>/dev/null | read_version || true)"
          fi

          release=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$version" != "$previous" ]; then
            release=true
          else
            echo "<Version> is still $version; nothing to release."
          fi

          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac

          {
            echo "version=$version"
            echo "release=$release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $version (previous: ${previous:-none}) → release=$release prerelease=$prerelease"

      # Fails before anything is published when CHANGELOG.md has no section for this version.
      - name: Extract the release notes
        if: steps.plan.outputs.release == 'true'
        run: ./scripts/release-notes.sh "${{ steps.plan.outputs.version }}" > release-notes.md

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-release
    permissions:
      contents: read
      id-token: write  # lets the job request the OIDC token NuGet/login exchanges
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # GITHUB_ACTIONS=true turns on ContinuousIntegrationBuild (see PlumePdf.csproj), so the
      # packed DLL and PDB carry /_/-normalized source paths.
      - name: Build
        run: dotnet build PlumePdf.sln -c Release -m:1
      - name: Test
        run: dotnet test PlumePdf.sln -c Release --no-build
      # Package validation compares the public API against the last published version
      # (PackageValidationBaselineVersion in PlumePdf.csproj) and fails on an unrecorded break.
      - name: Pack
        run: dotnet pack src/PlumePdf/PlumePdf.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg from the same folder.
      # --skip-duplicate makes a re-run after a partial failure finish cleanly instead of 409-ing.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the tag and the release; nothing else in this workflow can write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlumePdf $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"
