  <!-- plumepdf icon · faithful vectorisation of the owner's chosen feather reference (1254 px raster).
       Method: the reference was decoded and posterised into colour masks (light teal / dark teal / amber /
       off-white), each region's contour was traced and fitted with cubic beziers (max error 1.6 px at 1254),
       then the whole drawing was scaled by 512/1254 and translated so the composite bbox (quill + swash)
       is centred in the tile. Coordinates below are those fitted curves in tile units.
       Reference measurements this reproduces: vane length:max-width 2.97:1, max width at 38 % of the
       length from the base (leading 132 / trailing 209 px at 1254), 37° lean from vertical, spine bowed
       41 px over 960 px, 5 leading + 6 trailing separations, nib hole r 12.5 px, slit 2.9 px (drawn 4.4).
       Tile: rx 112 on #0b0a09, nothing outside it. Palette: #3fc7bd light teal (leading half), #189188 dark
       teal (trailing half — the reference's measured #139393 re-hued to #3fc7bd's hue 175.6°), #e8a33d amber
       spine + nib, #f4f1ea ink swash, hole + slit cut in the ground colour. Flat fills only. -->
